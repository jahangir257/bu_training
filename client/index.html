<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Module 4 - React Frontend</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; color: #1e293b; }
  .container { max-width: 720px; margin: 40px auto; padding: 0 20px; }
  h1 { color: #2563eb; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  input, select { display: block; width: 100%; padding: 8px; margin: 6px 0 12px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
  button { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .error { color: #dc2626; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e2e8f0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; color: #fff; }
  .admin { background: #16a34a; }
  .user { background: #64748b; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// Point this at your running Express server (see server.js, default port 5000)
const API_BASE = 'http://localhost:5000/api';

function App() {
  const [token, setToken] = useState(localStorage.getItem('token') || '');
  const [currentUser, setCurrentUser] = useState(null);

  useEffect(() => {
    if (token) {
      fetch(`${API_BASE}/auth/me`, { headers: { Authorization: `Bearer ${token}` } })
        .then((r) => r.json())
        .then((data) => {
          if (data.success) setCurrentUser(data.user);
          else logout();
        })
        .catch(() => logout());
    }
  }, [token]);

  const logout = () => {
    localStorage.removeItem('token');
    setToken('');
    setCurrentUser(null);
  };

  const handleLogin = (newToken) => {
    localStorage.setItem('token', newToken);
    setToken(newToken);
  };

  return (
    <div className="container">
      <h1>Module 4: React frontend</h1>
      <p>This static page (no build step - React loaded via CDN) talks to the Express + MongoDB API from Modules 1-3.</p>
      {!token && <AuthForm onLogin={handleLogin} />}
      {token && currentUser && (
        <div>
          <div className="card">
            Logged in as <b>{currentUser.name}</b> ({currentUser.email}){' '}
            <span className={`badge ${currentUser.role}`}>{currentUser.role}</span>
            <button style={{ float: 'right' }} onClick={logout}>Logout</button>
          </div>
          <ProductsPanel token={token} role={currentUser.role} />
        </div>
      )}
    </div>
  );
}

function AuthForm({ onLogin }) {
  const [mode, setMode] = useState('login'); // 'login' | 'register'
  const [form, setForm] = useState({ name: '', email: '', password: '', role: 'user' });
  const [error, setError] = useState('');

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    const endpoint = mode === 'login' ? 'login' : 'register';
    try {
      const res = await fetch(`${API_BASE}/auth/${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(form)
      });
      const data = await res.json();
      if (!data.success) return setError(data.message || 'Something went wrong');
      onLogin(data.token);
    } catch (err) {
      setError('Could not reach the API. Is the server running on port 5000?');
    }
  };

  return (
    <div className="card">
      <h2>{mode === 'login' ? 'Login' : 'Register'}</h2>
      <form onSubmit={submit}>
        {mode === 'register' && (
          <input placeholder="Name" value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })} required />
        )}
        <input type="email" placeholder="Email" value={form.email}
          onChange={(e) => setForm({ ...form, email: e.target.value })} required />
        <input type="password" placeholder="Password" value={form.password}
          onChange={(e) => setForm({ ...form, password: e.target.value })} required />
        {mode === 'register' && (
          <select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })}>
            <option value="user">Normal user</option>
            <option value="admin">Admin</option>
          </select>
        )}
        {error && <p className="error">{error}</p>}
        <button type="submit">{mode === 'login' ? 'Login' : 'Register'}</button>
      </form>
      <p>
        {mode === 'login' ? "Don't have an account? " : 'Already have an account? '}
        <a href="#" onClick={(e) => { e.preventDefault(); setMode(mode === 'login' ? 'register' : 'login'); setError(''); }}>
          {mode === 'login' ? 'Register' : 'Login'}
        </a>
      </p>
    </div>
  );
}

function ProductsPanel({ token, role }) {
  const [products, setProducts] = useState([]);
  const [form, setForm] = useState({ name: '', description: '', price: '', quantity: '' });
  const [error, setError] = useState('');

  const authHeaders = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };

  const loadProducts = () => {
    fetch(`${API_BASE}/products`, { headers: authHeaders })
      .then((r) => r.json())
      .then((data) => { if (data.success) setProducts(data.products); });
  };

  useEffect(loadProducts, []);

  const createProduct = async (e) => {
    e.preventDefault();
    setError('');
    const res = await fetch(`${API_BASE}/products`, {
      method: 'POST',
      headers: authHeaders,
      body: JSON.stringify({ ...form, price: Number(form.price), quantity: Number(form.quantity) })
    });
    const data = await res.json();
    if (!data.success) return setError(data.message);
    setForm({ name: '', description: '', price: '', quantity: '' });
    loadProducts();
  };

  const deleteProduct = async (id) => {
    await fetch(`${API_BASE}/products/${id}`, { method: 'DELETE', headers: authHeaders });
    loadProducts();
  };

  return (
    <div className="card">
      <h2>Products</h2>
      <table>
        <thead>
          <tr><th>Name</th><th>Price</th><th>Qty</th>{role === 'admin' && <th></th>}</tr>
        </thead>
        <tbody>
          {products.map((p) => (
            <tr key={p._id}>
              <td>{p.name}</td>
              <td>{p.price}</td>
              <td>{p.quantity}</td>
              {role === 'admin' && (
                <td><button onClick={() => deleteProduct(p._id)}>Delete</button></td>
              )}
            </tr>
          ))}
          {products.length === 0 && <tr><td colSpan="4">No products yet.</td></tr>}
        </tbody>
      </table>

      {role === 'admin' && (
        <div style={{ marginTop: 20 }}>
          <h3>Add product (admin only)</h3>
          <form onSubmit={createProduct}>
            <input placeholder="Name" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} required />
            <input placeholder="Description" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
            <input type="number" placeholder="Price" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} required />
            <input type="number" placeholder="Quantity" value={form.quantity} onChange={(e) => setForm({ ...form, quantity: e.target.value })} />
            {error && <p className="error">{error}</p>}
            <button type="submit">Add product</button>
          </form>
        </div>
      )}
      {role !== 'admin' && <p><i>Only admin users can add or delete products. You can view the list.</i></p>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
